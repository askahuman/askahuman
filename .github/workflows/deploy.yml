# Deploy the relay + PWA to the private GKE cluster on a version tag.
#
# KEYLESS: authenticates via Workload Identity Federation — no service-account
# JSON key anywhere. The private project / registry / cluster identity lives
# ONLY in GitHub Secrets, never in this public repo.
#
# Keep credentials and private infrastructure identity out of public logs: no
# `set -x`, env dumps or raw manifest/describe output. The scoped preflight reads
# JSON into memory and emits fixed booleans only. ref. architecture/0013.
#
# One-time setup (NOT in this repo):
#   - Artifact Registry repo holding relay/ + web/ images.
#   - Deployer SA with roles/artifactregistry.writer + roles/gkehub.gatewayEditor +
#     roles/gkehub.viewer (Connect Gateway); WIF principalSet bound to THIS repo.
#   - Namespace `ask-a-human` + a RoleBinding granting the SA edit on it (NOT the
#     cluster-wide container.developer — keep blast radius to the one namespace).
#   - GitHub Secrets: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA,
#     GKE_CLUSTER, GAR_REGISTRY (e.g. <region>-docker.pkg.dev/<project>/<repo>).
name: deploy

on:
  push:
    tags: ["v*"]

# Minimal scopes. id-token:write is REQUIRED for WIF; contents:read for checkout.
permissions:
  contents: read
  id-token: write

# Serialize deploys; never cancel a half-applied rollout.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Optional manual gate: configure the 'production' Environment with required
    # reviewers in repo Settings → Environments to make every tag deploy wait for
    # an approval click. Until configured, it runs as before (no gate).
    environment: production
    env:
      TAG: ${{ github.ref_name }}
      GAR_REGISTRY: ${{ secrets.GAR_REGISTRY }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Public tool downloads run before federation. The same pinned Google
      # action bundles execute under capture, including their error paths.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare pinned cloud actions
        run: python3 scripts/private_cloud.py prepare
      - name: Install cloud SDK before authentication
        run: python3 scripts/private_cloud.py install_sdk
      - name: Authenticate through Workload Identity Federation
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ secrets.GCP_DEPLOYER_SA }}
        run: python3 scripts/private_cloud.py authenticate
      - name: Configure the authenticated SDK
        run: python3 scripts/private_cloud.py configure_sdk

      - name: Configure Docker for Artifact Registry
        run: python3 scripts/private_cloud.py configure_registry

      - name: Build and push relay image
        run: python3 scripts/private_cloud.py build_relay
      - name: Build and push web image
        run: python3 scripts/private_cloud.py build_web
      - name: Get cluster credentials
        run: python3 scripts/private_cloud.py cluster_credentials
      - name: Set images and apply
        run: python3 scripts/private_cloud.py apply
      - name: Wait for rollout
        run: python3 scripts/private_cloud.py rollout

      - name: Verify production topology and released images
        run: |
          export EXPECTED_VERSION="${TAG#v}"
          python3 scripts/production_preflight.py

      - name: Verify public versions and actual proxy path
        run: |
          export EXPECTED_VERSION="${TAG#v}" EXPECTED_COMMIT="$GITHUB_SHA"
          python3 scripts/verify_public_release.py

      - name: Remove cloud credentials and private temporary state
        if: always()
        run: python3 scripts/private_cloud.py cleanup
