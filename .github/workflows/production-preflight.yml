# No apply, rollout, exec, logs, Secret reads or cloud mutations. Private API
# responses and CLI errors stay in memory; the script emits fixed booleans only.
name: production-preflight

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Optional deployed version (without v); blank checks current topology only"
        required: false
        type: string
      expected_commit:
        description: "Full public commit SHA; required with version to check the public release"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# Coordinate with tag deployments to avoid reading a half-applied rollout.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
      GAR_REGISTRY: ${{ secrets.GAR_REGISTRY }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Public tool downloads run before federation. The same pinned Google
      # action bundles execute under capture, including their error paths.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Prepare pinned cloud actions
        run: python3 scripts/private_cloud.py prepare
      - name: Install cloud SDK before authentication
        run: python3 scripts/private_cloud.py install_sdk
      - name: Authenticate through Workload Identity Federation
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ secrets.GCP_DEPLOYER_SA }}
        run: python3 scripts/private_cloud.py authenticate
      - name: Configure the authenticated SDK
        run: python3 scripts/private_cloud.py configure_sdk

      - name: Read-only production topology and rollout checks
        run: python3 scripts/production_preflight.py
      - name: Verify the public release and actual GFE proxy path
        if: inputs.expected_version != '' || inputs.expected_commit != ''
        run: python3 scripts/verify_public_release.py

      - name: Remove cloud credentials and private temporary state
        if: always()
        run: python3 scripts/private_cloud.py cleanup
