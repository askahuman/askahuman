# Tests + linters on every push / PR — the status checks that make the CODEOWNERS
# branch-protection rule meaningful. Backend (Go) and frontend (Astro/TS) run in
# parallel jobs; each mirrors the repo's Makefile / package.json commands.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: golangci-lint (v2)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.3/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.3
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.8"
      # The Go<->JS SPAKE2 interop check shells out to the Go toolchain.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: bun install --frozen-lockfile
      - name: Type-check (astro check)
        run: bun run check
      - name: Unit tests (vitest)
        run: bun run test
      - name: Build PWA
        run: bun run build
      - name: Go<->JS SPAKE2 + secretbox interop
        run: bun run interop

  web-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build production Linux image
        run: docker build --tag askahuman-web:ci frontend
      - name: Serve the PWA with production runtime restrictions
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' askahuman-web:ci)" = 101
          docker run --detach --name web-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp --tmpfs /var/cache/nginx \
            --tmpfs /var/run --publish 127.0.0.1:18081:8080 askahuman-web:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18081/app/ --output /tmp/app.html
          python3 scripts/check-web-container.py
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs web-smoke || true
          docker rm --force web-smoke || true
