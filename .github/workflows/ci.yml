# Tests + linters on every push / PR — the status checks that make the CODEOWNERS
# branch-protection rule meaningful. Backend (Go) and frontend (Astro/TS) run in
# parallel jobs; each mirrors the repo's Makefile / package.json commands.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Agent build identity and command-line smoke test
        run: python3 ../scripts/check_agent_version.py
      - name: golangci-lint (v2)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.3/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.3
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.8"
      # The Go<->JS SPAKE2 interop check shells out to the Go toolchain.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: bun install --frozen-lockfile
      - name: Type-check (astro check)
        run: bun run check
      - name: Unit tests (vitest)
        run: bun run test
      - name: Build PWA
        run: bun run build
      - name: Go<->JS PAKE, secretbox, and v2 approval protocol interop
        run: bun run interop
      - name: Install regression browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Phone interaction, recovery, hosted pairing, and notification regressions
        run: |
          node e2e/phone-interactions.mjs
          node e2e/session-recovery.mjs
          node e2e/hosted-pairing.mjs
          node e2e/multi-agent-push.mjs
      - name: Native push reconciliation across Chromium and WebKit tabs
        run: |
          RECOVERY_PORT=19480 node e2e/push-reconciliation.mjs
          RECOVERY_BROWSER=webkit RECOVERY_PORT=19580 node e2e/push-reconciliation.mjs
      - name: Authenticated approval protocol in Chromium and WebKit
        run: |
          RECOVERY_PORT=19280 node e2e/approval-protocol.mjs
          RECOVERY_BROWSER=webkit RECOVERY_PORT=19380 node e2e/approval-protocol.mjs
      - name: Complete receipt content in Chromium and WebKit
        run: |
          RECOVERY_PORT=19680 node e2e/confirmation-layout.mjs
          RECOVERY_BROWSER=webkit RECOVERY_PORT=19780 node e2e/confirmation-layout.mjs

  web-container:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_VERSION: "0.0.0"
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build production Linux image
        run: |
          docker build --tag askahuman-web:ci \
            --build-arg PUBLIC_BUILD_VERSION="$EXPECTED_VERSION" \
            --build-arg PUBLIC_BUILD_COMMIT="$EXPECTED_COMMIT" frontend
      - name: Scan final runtime image for high and critical vulnerabilities
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output /tmp/trivy.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tar.gz' | sha256sum --check --strict
          mkdir /tmp/trivy-bin
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy-bin trivy
          /tmp/trivy-bin/trivy image --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress askahuman-web:ci
      - name: Serve the PWA with production runtime restrictions
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' askahuman-web:ci)" = 101
          docker run --detach --name web-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp --tmpfs /var/cache/nginx \
            --tmpfs /var/run --publish 127.0.0.1:18081:8080 askahuman-web:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18081/app/ --output /tmp/app.html
          python3 scripts/check-web-container.py
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs web-smoke || true
          docker rm --force web-smoke || true

  release-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Topology, redaction, and public release probe regressions
        run: python3 -m unittest discover -s scripts -p test_release_verification.py -v

  npm-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Installer isolation, integrity failures, and interrupted response regressions
        run: node --test npm/test/install.test.cjs
